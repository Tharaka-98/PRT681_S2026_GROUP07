version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"

  bookstore-api:
    build:
      context: .
      dockerfile: BookstoreApi/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
      - seq
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=BookstoreDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
      Seq__Url: "http://seq:80"
      Temporal__Host: "host.docker.internal:7233"