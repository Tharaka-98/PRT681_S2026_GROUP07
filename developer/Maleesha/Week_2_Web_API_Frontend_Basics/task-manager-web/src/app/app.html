<div class="page">
  <div class="card">
    <header class="header">
      <h1>Task Manager</h1>
      <p class="subtitle">Stay on top of what matters</p>
    </header>

    <form (ngSubmit)="addTask()" class="task-form">
      <input
        type="text"
        [ngModel]="newTitle()"
        (ngModelChange)="newTitle.set($event)"
        name="title"
        placeholder="What needs to be done?"
        autocomplete="off"
      />
      <button type="submit" class="btn-add">Add Task</button>
    </form>

    <p class="error" *ngIf="error()">{{ error() }}</p>

    <div class="status" *ngIf="loading()">
      <div class="spinner"></div>
      <span>Loading tasks...</span>
    </div>

    <ul class="task-list" *ngIf="!loading() && tasks().length > 0">
      <li *ngFor="let task of tasks()" [class.completed]="task.isComplete">
        <label class="task-row">
          <input type="checkbox" [checked]="task.isComplete" (change)="toggleComplete(task)" />
          <span class="task-title">{{ task.title }}</span>
        </label>
        <button class="btn-delete" (click)="deleteTask(task.id)" aria-label="Delete task">
          Delete
        </button>
      </li>
    </ul>

    <div class="empty-state" *ngIf="!loading() && tasks().length === 0">
      <p>No tasks yet</p>
      <span>Add one above to get started</span>
    </div>

    <footer class="footer" *ngIf="!loading() && tasks().length > 0">
      {{ tasks().length }} task{{ tasks().length !== 1 ? 's' : '' }} total
    </footer>
  </div>
</div>
